# spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mypcdb?useSSL=false&serverTimezone=Asia/Taipei&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}

# spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}

# spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:8888}



# ============================================================
# 3. HikariCP Connection Pool
# ============================================================

# HikariCP 是 Spring Boot 預設使用的 JDBC Connection Pool。
#
# 白話：
#
# Spring Boot 不會每次查詢 MySQL
# 都重新建立一條資料庫連線。
#
# 而是事先準備一些 Connection，
# 需要時拿來使用，用完再放回 Pool。


# 最多同時保留 10 條資料庫連線
spring.datasource.hikari.maximum-pool-size=10


# 最少保留 2 條閒置連線
spring.datasource.hikari.minimum-idle=2


# 等待取得 Connection 最長 30 秒
#
# 30000 ms = 30 秒
spring.datasource.hikari.connection-timeout=30000


# Connection 閒置最長時間
#
# 600000 ms = 10 分鐘
spring.datasource.hikari.idle-timeout=600000


# 單一 Connection 最長生命週期
#
# 1800000 ms = 30 分鐘
spring.datasource.hikari.max-lifetime=1800000



# ============================================================
# 4. JPA / Hibernate
# ============================================================

# ------------------------------------------------------------
# Hibernate DDL
# ------------------------------------------------------------
#
# update：
#
# Entity 對應的 Table 不存在
# → Hibernate 嘗試建立
#
# Entity 欄位改變
# → Hibernate 嘗試更新 Table
#
# 已經存在的資料
# → 不會每次啟動就全部刪除
#
# 適合目前開發階段。
#
# 正式 Production 通常不建議依賴 update。
#
# ------------------------------------------------------------

spring.jpa.hibernate.ddl-auto=update



# ------------------------------------------------------------
# 顯示 Hibernate SQL
# ------------------------------------------------------------
#
# Eclipse Console 可以看到 Hibernate
# 實際執行的 SQL。
#
# 學習與除錯時非常有用。

spring.jpa.show-sql=true



# ------------------------------------------------------------
# SQL 排版
# ------------------------------------------------------------
#
# 把 Hibernate SQL 排版得比較容易閱讀。

spring.jpa.properties.hibernate.format_sql=true



# ------------------------------------------------------------
# MySQL Dialect
# ------------------------------------------------------------
#
# Hibernate 通常可以透過 JDBC
# 自動判斷目前使用 MySQL。
#
# 所以目前不需要指定。
#
# 如果未來有特殊需求可以再打開。
#
# ------------------------------------------------------------

# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect



# ------------------------------------------------------------
# Open Session In View
# ------------------------------------------------------------
#
# false：
#
# 不讓 Controller / JSON 序列化階段
# 還繼續偷偷向資料庫抓 Lazy Loading 資料。
#
# 可以讓資料庫操作的責任
# 比較集中在 Service 層。

spring.jpa.open-in-view=false



# ============================================================
# 5. MyBatis
# ============================================================

# ------------------------------------------------------------
# Mapper XML 位置
# ------------------------------------------------------------
#
# 對應：
#
# src/main/resources/mapper/*.xml
#
# 例如：
#
# ProductMapper.xml
# OrderMapper.xml
# UserMapper.xml
#
# ------------------------------------------------------------

mybatis.mapper-locations=classpath:mapper/*.xml



# ------------------------------------------------------------
# Type Alias
# ------------------------------------------------------------
#
# Java Entity / Object 所在 package。
#
# 設定之後 Mapper XML 可以使用
# 比較簡短的 class 名稱。

mybatis.type-aliases-package=com.example.demo.entity



# ------------------------------------------------------------
# snake_case → camelCase
# ------------------------------------------------------------
#
# MySQL：
#
# sales_count
#
# Java：
#
# salesCount
#
#
# MySQL：
#
# file_name
#
# Java：
#
# fileName
#
# ------------------------------------------------------------

mybatis.configuration.map-underscore-to-camel-case=true



# ------------------------------------------------------------
# MyBatis SQL Log
# ------------------------------------------------------------
#
# 在 Eclipse Console 顯示
# MyBatis 執行的 SQL。

mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl



# ============================================================
# 6. JWT - RS256
# ============================================================

# ------------------------------------------------------------
# RS256
# ------------------------------------------------------------
#
# MYPC Shop 使用非對稱式簽章：
#
# Private Key
#      ↓
# 簽署 JWT
#
# Public Key
#      ↓
# 驗證 JWT
#
# ------------------------------------------------------------



# ------------------------------------------------------------
# Private Key
# ------------------------------------------------------------
#
# 登入成功：
#
# User Login
#      ↓
# Spring Security
#      ↓
# Private Key
#      ↓
# Sign JWT
#      ↓
# Token
#
#
# 實際位置：
#
# src/main/resources/keys/private_key.pem
#
# ★★★★★ 非常重要 ★★★★★
#
# private_key.pem 不應上傳公開 GitHub。
#
# 等一下 GitHub 前，
# 我們會處理 .gitignore。
#
# ------------------------------------------------------------

app.jwt.private-key=classpath:keys/private_key.pem



# ------------------------------------------------------------
# Public Key
# ------------------------------------------------------------
#
# Client 帶 JWT 回來：
#
# Authorization
# Bearer xxxxx
#
#        ↓
#
# JwtAuthenticationFilter
#
#        ↓
#
# Public Key
#
#        ↓
#
# 驗證 Token
#
# ------------------------------------------------------------

app.jwt.public-key=classpath:keys/public_key.pem



# ------------------------------------------------------------
# JWT Expiration
# ------------------------------------------------------------
#
# 單位：毫秒
#
# 1000 ms = 1 秒
#
# 86400000 ms
# = 24 小時

app.jwt.expiration=86400000



# ============================================================
# 7. 舊版 JWT HS256 - 不使用
# ============================================================

# ------------------------------------------------------------
# 專案目前使用：
#
# RS256
#
# Private Key + Public Key
#
# 所以舊版 HS256 Secret Key
# 不需要啟用。
# ------------------------------------------------------------

# app.jwt.secret=xxxxxxxxxxxxxxxxxxxxxxxx



# ============================================================
# 8. Jackson JSON
# ============================================================

# ------------------------------------------------------------
# 日期時間格式
# ------------------------------------------------------------
#
# Java Object：
#
# LocalDateTime
#
#       ↓
#
# JSON：
#
# 2026-09-17 15:30:00
#
# ------------------------------------------------------------

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss



# JSON 日期時間使用台灣時區
spring.jackson.time-zone=Asia/Taipei



# ============================================================
# 9. Character Encoding
# ============================================================

# ------------------------------------------------------------
# 統一使用 UTF-8
# ------------------------------------------------------------
#
# 避免：
#
# 中文商品名稱
# 中文留言
# 中文報表資料
#
# 出現亂碼。
#
# ------------------------------------------------------------

server.servlet.encoding.charset=UTF-8

server.servlet.encoding.enabled=true

server.servlet.encoding.force=true



# ============================================================
# 10. Thymeleaf
# ============================================================

# ------------------------------------------------------------
# MYPC Shop 主要前端使用 React。
#
# 如果沒有使用：
#
# src/main/resources/templates
#
# Spring Boot 啟動時可能出現：
#
# Cannot find template location:
# classpath:/templates/
#
# 所以關閉 Template Location 檢查。
#
# ------------------------------------------------------------

spring.thymeleaf.check-template-location=false



# ============================================================
# 11. DevTools
# ============================================================

# ------------------------------------------------------------
# Eclipse 開發期間：
#
# 修改 Java 程式
#      ↓
# DevTools
#      ↓
# Spring Boot 自動 Restart
#
# ------------------------------------------------------------

spring.devtools.restart.enabled=true



# ============================================================
# 12. Logging
# ============================================================

# ------------------------------------------------------------
# 系統預設 Log Level
# ------------------------------------------------------------

logging.level.root=INFO



# ------------------------------------------------------------
# MYPC Shop Java Package
# ------------------------------------------------------------

logging.level.com.example.demo=INFO



# ------------------------------------------------------------
# Spring Security Debug
# ------------------------------------------------------------
#
# 登入、JWT、403、401 等問題
# 需要除錯時再打開。
#
# 平常先關閉，否則 Console 資訊很多。
#
# ------------------------------------------------------------

# logging.level.org.springframework.security=DEBUG



# ------------------------------------------------------------
# MyBatis Mapper Debug
# ------------------------------------------------------------

logging.level.com.example.demo.mapper=DEBUG



# ============================================================
# 13. Multipart File Upload
# ============================================================

# ------------------------------------------------------------
# 單一檔案最大 10 MB
# ------------------------------------------------------------

spring.servlet.multipart.max-file-size=10MB



# ------------------------------------------------------------
# 單次 HTTP Request 最大 55 MB
# ------------------------------------------------------------
#
# 例如留言功能：
#
# 最多 5 張圖片
#
# 5 × 10 MB
# = 50 MB
#
# 再預留約 5 MB
# 給：
#
# JSON
# Form Data
# HTTP Request
#
# ------------------------------------------------------------

spring.servlet.multipart.max-request-size=55MB



