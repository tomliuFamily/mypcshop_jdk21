# ============================================================
# 2-3. Docker App → Windows MySQL - 目前不用
# ============================================================

# ------------------------------------------------------------
# 如果未來：
#
# Spring Boot 在 Docker
#
# 但是：
#
# MySQL 在 Windows
#
# Docker 裡不能使用 localhost 找 Windows MySQL。
#
# 要使用：
#
