# ============================================================
# MYPC SHOP - application.properties
# ============================================================
#
# 技術架構：
#
# Spring Boot + React + MySQL
# JPA + MyBatis
# Spring Security + JWT RS256
# WebSocket
# JasperReports
#
#
# ============================================================
# 目前開發模式
# ============================================================
#
# React：
# http://localhost:5173
#
#          ↓ HTTP / REST API
#
# Spring Boot：
# 使用 Eclipse 執行
# http://localhost:8080
#
#          ↓ JDBC
#
# Windows 本機 MySQL：
# Host     = localhost
# Port     = 3306
# Database = mypcdb
# User     = root
#
#
# 目前資料流：
#
# React :5173
#      ↓
# Spring Boot :8080
#      ↓
# MySQL :3306
#      ↓
# mypcdb
#
#
# ============================================================
# Docker
# ============================================================
#
# 目前暫時不使用 Docker。
#
# Docker 相關設定保留在下面的註解中，
# 未來要重新使用 Docker 時再啟用。
#
# ============================================================



# ============================================================
# 1. Server
# ============================================================

# Spring Boot HTTP Port
#
# React 會透過：
# http://localhost:8080
#
# 呼叫 Spring Boot REST API。

server.port=8080



# ============================================================
# 2. MySQL Database - 目前使用
# ============================================================

# ------------------------------------------------------------
# Windows 本機 MySQL
# ------------------------------------------------------------
#
# localhost
#     ↓
# 3306
#     ↓
# mypcdb
#
# 目前 Spring Boot 是由 Eclipse 執行，
# 所以直接連 Windows 本機安裝的 MySQL。
#
# ------------------------------------------------------------

spring.datasource.url=jdbc:mysql://localhost:3306/mypcdb?useSSL=false&serverTimezone=Asia/Taipei&characterEncoding=UTF-8&allowPublicKeyRetrieval=true

# MySQL 使用者
spring.datasource.username=root

# MySQL 密碼
#
# ★ 目前本機開發暫時直接使用。
#
# ★ 上傳 GitHub 前，
#   建議改成環境變數，避免把真正密碼上傳。
#
# 例如未來可以改成：
#
# spring.datasource.password=${DB_PASSWORD}
#

spring.datasource.password=${DB_PASSWORD}
# MySQL JDBC Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



