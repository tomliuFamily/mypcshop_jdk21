# spring.datasource.url=jdbc:mysql://host.docker.internal:3306/mypcdb?useSSL=false&serverTimezone=Asia/Taipei&characterEncoding=UTF-8&allowPublicKeyRetrieval=true

# spring.datasource.username=root

# spring.datasource.password=${DB_PASSWORD}



# ============================================================
# 2-4. Docker 環境變數版本 - 目前不用
# ============================================================

# ------------------------------------------------------------
# 這是之前為 Docker Compose 準備的設定方式。
#
# 格式：
#
# ${環境變數名稱:預設值}
#
# 未來重新做 Docker / Jenkins 部署時，
